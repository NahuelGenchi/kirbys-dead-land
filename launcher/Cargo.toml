[package]
name = "kirbys-dead-land-launcher"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Installs and starts Kirby's Dead Land"
publish = false

[[bin]]
name = "kirbys-dead-land"
path = "src/main.rs"

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "accessibility"] }
png = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = "3.4"
flate2 = "1"
tar = "0.4"
zip = { version = "8", default-features = false, features = ["deflate"] }
rfd = { version = "0.17", default-features = false, features = ["xdg-portal", "wayland"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# The Windows calls in src/windows.rs (#250).
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Registry", "Win32_System_SystemInformation",
    "Win32_System_SystemServices", "Win32_System_Threading", "Win32_UI_Input_XboxController", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
slint-build = "=1.18.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
